name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  deploy:
    name: Production deployment
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nothing ships unless the whole workspace passes.
      - name: Verify
        run: npm run typecheck && npm run lint && npm test

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'
          terraform_wrapper: false

      - name: Terraform init (R2 backend)
        run: |
          terraform -chdir=terraform init -input=false \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            -backend-config="endpoints={s3=\"https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"

      - name: Terraform apply
        run: |
          terraform -chdir=terraform apply -auto-approve -input=false \
            -var="cloudflare_account_id=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" \
            -var="cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}"

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply flare-db --remote --cwd packages/db

      # Secrets live only in GitHub and are pushed to the Worker here. CLERK_JWT_KEY is
      # optional but recommended: it lets the Worker verify sessions without a network call.
      - name: Configure Worker secrets
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1" value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --cwd apps/api
            else
              echo "Skipping $name (not set)"
            fi
          }
          put_secret CLERK_SECRET_KEY "$CLERK_SECRET_KEY"
          put_secret CLERK_JWT_KEY "$CLERK_JWT_KEY"
          put_secret DEEPINFRA_API_KEY "$DEEPINFRA_API_KEY"

      - name: Deploy API Worker
        run: npx wrangler deploy --cwd apps/api

      - name: Build web client
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_ASSETS_URL: ${{ secrets.NEXT_PUBLIC_ASSETS_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY" ] || [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "::error::NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY and NEXT_PUBLIC_API_URL must be set"
            exit 1
          fi
          npm run build --workspace=@flare/web

      - name: Deploy web client to Pages
        run: npx wrangler pages deploy apps/web/out --project-name=flare-web --branch=main --commit-dirty=true
